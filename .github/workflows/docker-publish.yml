name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  # needed so GITHUB_TOKEN can flip package visibility after first publish
  # (repo-linked packages only; see "Ensure GHCR package is public" step)

env:
  REGISTRY: ghcr.io
  # Keep image name stable even if the git repo is renamed later.
  IMAGE_NAME: d-kholin/k8up-btl

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure GHCR package is public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer gh; fall back to curl. Packages must be linked to this repo.
          if command -v gh >/dev/null; then
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/user/packages/container/k8up-btl/visibility" \
              -f visibility=public \
              && echo "package set public via /user" && exit 0 || true
            gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/users/${{ github.repository_owner }}/packages/container/k8up-btl/visibility" \
              -f visibility=public \
              && echo "package set public via /users" && exit 0 || true
          fi
          code=$(curl -sS -o /tmp/vis.out -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/user/packages/container/k8up-btl/visibility" \
            -d '{"visibility":"public"}' || true)
          echo "curl visibility HTTP $code: $(cat /tmp/vis.out || true)"
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::warning::Could not set package public via API (HTTP $code). Set visibility manually: https://github.com/users/${{ github.repository_owner }}/packages/container/package/k8up-btl"
          fi
