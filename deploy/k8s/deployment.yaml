apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8up-gui-data
  namespace: k8up-gui
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8up-gui
  namespace: k8up-gui
  labels:
    app.kubernetes.io/name: k8up-gui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8up-gui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8up-gui
    spec:
      serviceAccountName: k8up-gui
      securityContext:
        fsGroup: 65532
      containers:
        - name: gui
          image: ghcr.io/d-kholin/k8up-gui:0.1.0 # pin; replace when publishing
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: ARGOCD_NAMESPACE
              value: argocd
            - name: AUDIT_DB_PATH
              value: /data/audit.db
            - name: AUTH_USER_HEADER
              value: X-authentik-username
            - name: AUTH_EMAIL_HEADER
              value: X-authentik-email
            # - name: PROMETHEUS_URL
            #   value: http://prometheus-server.monitoring.svc:80
            # - name: GRAFANA_DASHBOARD_URL
            #   value: https://grafana.example.com/d/k8up
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: k8up-gui-data
---
apiVersion: v1
kind: Service
metadata:
  name: k8up-gui
  namespace: k8up-gui
  labels:
    app.kubernetes.io/name: k8up-gui
spec:
  selector:
    app.kubernetes.io/name: k8up-gui
  ports:
    - name: http
      port: 80
      targetPort: http
