apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: k8up-btl
resources:
  - namespace.yaml
  - rbac.yaml
  - pvc.yaml
  - deployment.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      app.kubernetes.io/name: k8up-btl
      app.kubernetes.io/part-of: k8up-btl
    includeSelectors: false
images:
  - name: ghcr.io/d-kholin/k8up-btl
    # Reference manifests only — set a real tag here (or via kustomize edit).
    # The live cluster pin is managed in k3s-hl (apps/k8up-btl/manifests).
    newTag: "1.x.x"