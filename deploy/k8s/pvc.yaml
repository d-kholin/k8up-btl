# App binaries (server, restic, static, CA bundle). Populated by the
# bootstrap Job once; survives pod restarts. No private image registry required.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8up-gui-app
  namespace: k8up-gui
  labels:
    app.kubernetes.io/name: k8up-gui
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
# SQLite audit DB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k8up-gui-data
  namespace: k8up-gui
  labels:
    app.kubernetes.io/name: k8up-gui
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
