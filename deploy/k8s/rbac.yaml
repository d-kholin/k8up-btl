apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8up-gui
  namespace: k8up-gui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8up-gui
rules:
  # K8up CRDs
  - apiGroups: ["k8up.io"]
    resources:
      - schedules
      - backups
      - restores
      - checks
      - prunes
      - snapshots
      - archives
      - prebackuppods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["k8up.io"]
    resources: ["restores", "backups", "checks"]
    verbs: ["create"]
  # Workloads + PVC ownership
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  # Restic repo credentials (same secrets K8up uses)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  # Argo CD Applications (pause/resume sync)
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8up-gui
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8up-gui
subjects:
  - kind: ServiceAccount
    name: k8up-gui
    namespace: k8up-gui
