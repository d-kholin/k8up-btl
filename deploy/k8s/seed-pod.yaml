# One-shot helper pod used to seed k8up-gui-app PVC. Not part of steady state.
apiVersion: v1
kind: Pod
metadata:
  name: k8up-gui-seed
  namespace: k8up-gui
  labels:
    app.kubernetes.io/name: k8up-gui-seed
spec:
  restartPolicy: Never
  containers:
    - name: seed
      image: docker.io/library/busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: app
          mountPath: /app
  volumes:
    - name: app
      persistentVolumeClaim:
        claimName: k8up-gui-app
